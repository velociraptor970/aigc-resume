<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>仗剑传说</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../evidence-fix.css">
    <style>
      body {
        margin: 0;
        background: #f6f4fb;
      }
      .local-doc-shell {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0 72px;
      }
      .local-doc-shell .evidence-card {
        margin-top: 24px;
      }
      .local-doc-path {
        margin-top: 16px;
        padding: 14px 16px;
        border: 1px solid rgba(17, 17, 17, 0.14);
        border-radius: 8px;
        background: rgba(17, 17, 17, 0.04);
        word-break: break-all;
      }
      .local-doc-note {
        margin-top: 12px;
        color: rgba(17, 17, 17, 0.68);
        line-height: 1.55;
      }
      button.button {
        cursor: pointer;
        font: inherit;
      }
      button.button[disabled] {
        cursor: not-allowed;
        opacity: 0.56;
      }
    </style>
  </head>
  <body>
    <main class="local-doc-shell">
      <div class="section-heading">
        <p class="eyebrow">GitHub Resources</p>
        <h2>仗剑传说</h2>
        <p class="section-subtitle">这份训练整理已经内置到仓库里，网页端可以直接打开。</p>
      </div>

      <article class="evidence-card">
        <span class="evidence-meta">DOCX / 96 MB</span>
        <h3>仗剑传说 - Flux2 klein</h3>
        <p>前期素材筛选、雾感素材处理、比例切割和 AI 补全的训练注意事项整理。</p>
        <p class="local-doc-path">assets/local-docs/【M88】场景画风训练-Flux2 klein  副本.docx</p>
        <p class="local-doc-note" id="local-note">这是仓库里的文件，按钮会直接打开 GitHub Pages 上的原件。</p>
        <div class="evidence-actions">
          <a class="button primary" id="open-local" href="【M88】场景画风训练-Flux2 klein  副本.docx" target="_blank" rel="noreferrer">打开仓库原件</a>
          <button class="button secondary" id="copy-local" type="button">复制文件链接</button>
          <a class="button secondary" href="../../index.html#local-docs">返回主站入口</a>
        </div>
      </article>
    </main>

    <script>
      const localUrl = new URL("【M88】场景画风训练-Flux2 klein  副本.docx", document.baseURI).href;
      const copyLocal = document.getElementById("copy-local");

      async function copyText(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (error) {
          // fall through to prompt
        }

        window.prompt("复制下面这段文件链接：", text);
        return false;
      }

      copyLocal.addEventListener("click", async () => {
        await copyText(localUrl);
        copyLocal.textContent = "已复制";
        setTimeout(() => { copyLocal.textContent = "复制文件链接"; }, 1200);
      });
    </script>
  </body>
</html>
