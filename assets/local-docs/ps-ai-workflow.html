<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PS-AI 工作整理预览</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../evidence-fix.css">
    <style>
      body {
        margin: 0;
        background: #f6f4fb;
      }
      .local-doc-shell {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0 72px;
      }
      .local-doc-shell .evidence-card {
        margin-top: 24px;
      }
      .preview-frame {
        margin-top: 20px;
        overflow: hidden;
        border: 2px solid rgba(17, 17, 17, 0.18);
        border-radius: 8px;
        background: #fff;
        box-shadow: 6px 6px 0 rgba(17, 17, 17, 0.12);
      }
      .preview-frame iframe {
        display: block;
        width: 100%;
        height: 72vh;
        border: 0;
        background: #fff;
      }
      .preview-doc-cover {
        display: grid;
        gap: 16px;
        padding: 28px;
        min-height: 72vh;
        background:
          linear-gradient(180deg, rgba(125, 92, 255, 0.08), rgba(255, 255, 255, 0.92)),
          #fff;
      }
      .preview-doc-cover h4 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
      }
      .preview-doc-cover p {
        margin: 0;
        color: rgba(17, 17, 17, 0.76);
        line-height: 1.6;
      }
      .preview-doc-cover ul {
        margin: 0;
        padding-left: 20px;
        color: rgba(17, 17, 17, 0.82);
        line-height: 1.75;
      }
      .preview-doc-cover li + li {
        margin-top: 8px;
      }
      .local-doc-path {
        margin-top: 16px;
        padding: 14px 16px;
        border: 1px solid rgba(17, 17, 17, 0.14);
        border-radius: 8px;
        background: rgba(17, 17, 17, 0.04);
        word-break: break-all;
      }
      .local-doc-note {
        margin-top: 12px;
        color: rgba(17, 17, 17, 0.68);
        line-height: 1.55;
      }
      .button {
        cursor: pointer;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main class="local-doc-shell">
      <div class="section-heading">
        <p class="eyebrow">GitHub Resources</p>
        <h2>PS-AI 工作整理</h2>
        <p class="section-subtitle">这里打开的是仓库内预览页，不直连原件下载。</p>
      </div>

      <article class="evidence-card">
        <span class="evidence-meta">DOCX / 26 MB</span>
        <h3>PS-AI 工作整理 副本</h3>
        <p>仓库原件，记录 PS-AI 工作流整理与岗位说明。</p>
        <p class="local-doc-path">assets/local-docs/PS-AI工作整理 副本.docx</p>
        <div class="preview-frame" id="preview">
          <iframe id="preview-frame" title="PS-AI 工作整理在线预览" loading="lazy"></iframe>
        </div>
        <p class="local-doc-note">网页保留预览入口，不再把用户带去原件下载页。</p>
        <div class="evidence-actions">
          <a class="button primary" id="open-local" href="#preview">查看预览框</a>
          <button class="button secondary" id="copy-local" type="button">复制预览链接</button>
          <a class="button secondary" href="../../index.html#local-docs">返回主站入口</a>
        </div>
      </article>
    </main>

    <script>
      const docUrl = new URL("PS-AI工作整理 副本.docx", document.baseURI).href;
      const previewUrl = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(docUrl)}`;
      const copyLocal = document.getElementById("copy-local");
      const previewFrame = document.getElementById("preview-frame");

      previewFrame.src = previewUrl;

      async function copyText(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (error) {
          // fall through to prompt
        }

        window.prompt("复制下面这段预览链接：", text);
        return false;
      }

      copyLocal.addEventListener("click", async () => {
        await copyText(location.href);
        copyLocal.textContent = "已复制";
        setTimeout(() => {
          copyLocal.textContent = "复制预览链接";
        }, 1200);
      });
    </script>
  </body>
</html>
