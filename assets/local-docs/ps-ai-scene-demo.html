<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ps ai 场景演示预览</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../evidence-fix.css">
    <style>
      body {
        margin: 0;
        background: #f6f4fb;
      }
      .local-doc-shell {
        width: min(1040px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0 64px;
      }
      .local-video-stage {
        display: grid;
        gap: 14px;
        min-height: 0;
        padding: 20px;
        border: 1px dashed rgba(17, 17, 17, 0.28);
        border-radius: 8px;
        background: rgba(125, 92, 255, 0.045);
        align-content: start;
      }
      .local-video-stage.is-dragover {
        background: rgba(125, 92, 255, 0.1);
        border-color: rgba(125, 92, 255, 0.72);
      }
      .local-video-placeholder,
      .local-video-viewer {
        display: grid;
        gap: 12px;
        min-height: 0;
        padding: 0;
        align-content: start;
      }
      .local-video-placeholder h4,
      .local-video-viewer h4 {
        margin: 0;
        font-size: 24px;
        line-height: 1.15;
      }
      .local-video-placeholder p,
      .local-video-viewer p {
        margin: 0;
        color: rgba(17, 17, 17, 0.76);
        line-height: 1.55;
      }
      .local-doc-path,
      .local-doc-note {
        margin: 10px 0 0;
        color: rgba(17, 17, 17, 0.68);
        font-size: 13px;
        line-height: 1.5;
      }
      .local-doc-path {
        word-break: break-all;
      }
      .local-video-player {
        width: 100%;
        min-height: 320px;
        max-height: 68vh;
        border: 1px solid rgba(17, 17, 17, 0.14);
        border-radius: 8px;
        background: rgba(17, 17, 17, 0.06);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.42);
      }
      .local-video-name {
        margin: 0;
        color: rgba(17, 17, 17, 0.68);
        word-break: break-all;
      }
      .button {
        cursor: pointer;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main class="local-doc-shell">
      <div class="section-heading">
        <p class="eyebrow">GitHub Resources</p>
        <h2>ps-ai 场景演示</h2>
        <p class="section-subtitle">选择文件夹自动找视频，也可以直接拖入播放；GitHub 页面只作备用入口。</p>
      </div>

      <article class="evidence-card">
        <span class="evidence-meta">MP4 / 209 MB</span>
        <h3>ps-ai 场景演示</h3>
        <p>展示 PS-AI 场景流程。选择本地文件夹后会按文件名别名检索，也可以把视频直接拖到播放区。</p>
        <p class="local-doc-path">本地匹配：ps-ai-scene-demo.mp4 / ps-ai场景演示.mp4</p>
        <div class="local-video-stage" id="dropzone">
          <div class="local-video-placeholder" id="empty-state">
            <h4>拖入视频，或选择本地文件夹</h4>
            <p>文件夹检索会同时匹配仓库英文名和你电脑里的中文文件名。</p>
            <div class="evidence-actions">
              <button class="button primary" id="pick-local-folder" type="button">选择本地文件夹</button>
              <button class="button secondary" id="pick-local-video" type="button">选择本地视频</button>
              <a class="button secondary" href="https://github.com/velociraptor970/aigc-resume/blob/main/assets/local-docs/ps-ai-scene-demo.mp4" target="_blank" rel="noreferrer">打开 GitHub 视频页</a>
            </div>
          </div>
          <div class="local-video-viewer" id="viewer" hidden>
            <video class="local-video-player" id="local-video" controls playsinline></video>
            <p class="local-video-name" id="file-name"></p>
            <div class="evidence-actions">
              <button class="button primary" id="change-local-folder" type="button">重新检索文件夹</button>
              <button class="button secondary" id="change-local-video" type="button">换一个本地视频</button>
              <a class="button secondary" href="https://github.com/velociraptor970/aigc-resume/blob/main/assets/local-docs/ps-ai-scene-demo.mp4" target="_blank" rel="noreferrer">打开 GitHub 视频页</a>
            </div>
          </div>
        </div>
        <a class="local-doc-note" href="../../index.html#local-docs">返回资源入口</a>
      </article>
    </main>

    <script>
      const pickLocalFolder = document.getElementById("pick-local-folder");
      const pickLocalVideo = document.getElementById("pick-local-video");
      const changeLocalFolder = document.getElementById("change-local-folder");
      const changeLocalVideo = document.getElementById("change-local-video");
      const localVideoInput = document.createElement("input");
      const dropzone = document.getElementById("dropzone");
      const emptyState = document.getElementById("empty-state");
      const viewer = document.getElementById("viewer");
      const localVideo = document.getElementById("local-video");
      const fileName = document.getElementById("file-name");
      const targetFileNames = ["ps-ai-scene-demo.mp4", "ps-ai场景演示.mp4", "ps-ai场景演示"];
      let currentVideoUrl = "";

      localVideoInput.type = "file";
      localVideoInput.accept = ".mp4,video/*";
      localVideoInput.hidden = true;
      document.body.appendChild(localVideoInput);

      function loadLocalFile(file) {
        const isVideo = file && (file.type.startsWith("video/") || /\.(mp4|webm|mov|m4v|avi)$/i.test(file.name));
        if (!isVideo) {
          window.alert("请选择一个视频文件。");
          return;
        }

        if (currentVideoUrl) {
          URL.revokeObjectURL(currentVideoUrl);
        }

        currentVideoUrl = URL.createObjectURL(file);
        localVideo.src = currentVideoUrl;
        fileName.textContent = `已载入：${file.name}`;
        emptyState.hidden = true;
        viewer.hidden = false;
        localVideo.play().catch(() => {});
      }

      function normalizeFileName(name) {
        return name
          .toLowerCase()
          .replace(/\.[^.]+$/, "")
          .replace(/[\s_()\-\[\]{}（）【】]+/g, "");
      }

      const normalizedTargetNames = targetFileNames.map(normalizeFileName);

      function matchesTargetFile(name) {
        const normalizedName = normalizeFileName(name);
        return normalizedTargetNames.some((target) => normalizedName === target || normalizedName.includes(target) || target.includes(normalizedName));
      }

      async function findFileInDirectory(directoryHandle) {
        for await (const [name, handle] of directoryHandle.entries()) {
          if (handle.kind === "file" && matchesTargetFile(name)) {
            return handle.getFile();
          }
          if (handle.kind === "directory") {
            const nestedFile = await findFileInDirectory(handle);
            if (nestedFile) {
              return nestedFile;
            }
          }
        }
        return null;
      }

      async function openFolderPicker() {
        if (!window.showDirectoryPicker) {
          window.alert("当前浏览器不支持文件夹检索，请改用选择本地视频。");
          return;
        }

        try {
          const directoryHandle = await window.showDirectoryPicker({ mode: "read" });
          const foundFile = await findFileInDirectory(directoryHandle);
          if (foundFile) {
            loadLocalFile(foundFile);
          } else {
            window.alert("没有找到对应视频。可以直接拖入 mp4，或点“选择本地视频”手动载入。");
          }
        } catch (error) {
          if (error && error.name !== "AbortError") {
            console.error(error);
          }
        }
      }

      function openPicker() {
        localVideoInput.value = "";
        localVideoInput.click();
      }

      pickLocalFolder.addEventListener("click", openFolderPicker);
      pickLocalVideo.addEventListener("click", openPicker);
      changeLocalFolder.addEventListener("click", openFolderPicker);
      changeLocalVideo.addEventListener("click", openPicker);

      localVideoInput.addEventListener("change", () => {
        const [file] = localVideoInput.files || [];
        if (file) {
          loadLocalFile(file);
        }
      });

      dropzone.addEventListener("dragover", (event) => {
        event.preventDefault();
        dropzone.classList.add("is-dragover");
      });

      dropzone.addEventListener("dragleave", () => {
        dropzone.classList.remove("is-dragover");
      });

      dropzone.addEventListener("drop", (event) => {
        event.preventDefault();
        dropzone.classList.remove("is-dragover");
        const [file] = event.dataTransfer.files || [];
        if (file) {
          loadLocalFile(file);
        }
      });

    </script>
  </body>
</html>
