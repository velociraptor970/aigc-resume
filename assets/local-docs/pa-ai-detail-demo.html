<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pa ai 立绘设计细化</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../evidence-fix.css">
    <style>
      body {
        margin: 0;
        background: #f6f4fb;
      }
      .local-doc-shell {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0 72px;
      }
      .local-doc-shell .evidence-card {
        margin-top: 24px;
      }
      .local-doc-path {
        margin-top: 16px;
        padding: 14px 16px;
        border: 1px solid rgba(17, 17, 17, 0.14);
        border-radius: 8px;
        background: rgba(17, 17, 17, 0.04);
        word-break: break-all;
      }
      .local-doc-note {
        margin-top: 12px;
        color: rgba(17, 17, 17, 0.68);
        line-height: 1.55;
      }
      button.button {
        cursor: pointer;
        font: inherit;
      }
      button.button[disabled] {
        cursor: not-allowed;
        opacity: 0.56;
      }
    </style>
  </head>
  <body>
    <main class="local-doc-shell">
      <div class="section-heading">
        <p class="eyebrow">GitHub Resources</p>
        <h2>PA-AI 立绘设计细化</h2>
        <p class="section-subtitle">这条美宣流程大视频已经内置到仓库里，网页端会直接跳到 GitHub raw。</p>
      </div>

      <article class="evidence-card">
        <span class="evidence-meta">MP4 / 208 MB</span>
        <h3>PA-AI 立绘设计细化（1.25 倍数）</h3>
        <p>仓库视频原件，展示立绘设计细化流程。</p>
        <p class="local-doc-path">assets/local-docs/pa-ai-detail-demo.mp4</p>
        <p class="local-doc-note" id="local-note">这是仓库里的视频，按钮会直接打开 GitHub raw 文件。</p>
        <div class="evidence-actions">
          <a class="button primary" id="open-local" href="https://raw.githubusercontent.com/velociraptor970/aigc-resume/main/assets/local-docs/pa-ai-detail-demo.mp4" target="_blank" rel="noreferrer">打开仓库视频</a>
          <button class="button secondary" id="copy-local" type="button">复制文件链接</button>
          <a class="button secondary" href="../../index.html#local-docs">返回主站入口</a>
        </div>
      </article>
    </main>

    <script>
      const localUrl = "https://raw.githubusercontent.com/velociraptor970/aigc-resume/main/assets/local-docs/pa-ai-detail-demo.mp4";
      const copyLocal = document.getElementById("copy-local");

      async function copyText(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (error) {
          // fall through to prompt
        }

        window.prompt("复制下面这段文件链接：", text);
        return false;
      }

      copyLocal.addEventListener("click", async () => {
        await copyText(localUrl);
        copyLocal.textContent = "已复制";
        setTimeout(() => { copyLocal.textContent = "复制文件链接"; }, 1200);
      });
    </script>
  </body>
</html>
