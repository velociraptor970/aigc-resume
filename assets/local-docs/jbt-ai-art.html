<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>吉比特｜美宣协作记录</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../evidence-fix.css">
    <style>
      body {
        margin: 0;
        background: #f6f4fb;
      }
      .local-doc-shell {
        width: min(1040px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0 72px;
      }
      .local-doc-shell .evidence-card {
        margin-top: 24px;
      }
      .local-doc-note {
        margin: 14px 0 0;
        color: rgba(17, 17, 17, 0.68);
        line-height: 1.55;
      }
      .local-pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 18px 0 0;
      }
      .local-pill {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        padding: 4px 10px;
        border: 1px solid rgba(17, 17, 17, 0.16);
        border-radius: 999px;
        background: rgba(125, 92, 255, 0.08);
        font-size: 13px;
        font-weight: 800;
      }
      .preview-frame {
        margin-top: 22px;
        overflow: hidden;
        border: 2px solid rgba(17, 17, 17, 0.18);
        border-radius: 8px;
        background: #fff;
        box-shadow: 6px 6px 0 rgba(17, 17, 17, 0.12);
      }
      .preview-frame img {
        display: block;
        width: 100%;
        height: 64vh;
        object-fit: cover;
      }
      .preview-top img {
        object-position: top center;
      }
      .evidence-actions {
        margin-top: 20px;
      }
      .button {
        cursor: pointer;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main class="local-doc-shell">
      <div class="section-heading">
        <p class="eyebrow">GitHub Resources / JBT</p>
        <h2>吉比特｜美宣协作记录</h2>
        <p class="section-subtitle">把 AI 生成接到美宣执行链里，重点展示需求判断、风格统一和结果交付。</p>
      </div>

      <article class="evidence-card">
        <span class="evidence-meta">项目补充 / 美宣协作</span>
        <h3>美宣协作流程</h3>
        <p>这一页适合对外说明：AI 不是单独产图，而是接进美宣流程后，怎么做判断、怎么保风格、怎么收结果。</p>
        <div class="local-pill-row" aria-label="关键词">
          <span class="local-pill">需求判断</span>
          <span class="local-pill">风格控制</span>
          <span class="local-pill">结果交付</span>
        </div>
        <figure class="preview-frame preview-top" aria-label="吉比特内容上半段预览">
          <img src="../jbt-external.jpg" alt="吉比特内容总览，上半段展示美宣协作部分">
        </figure>
        <p class="local-doc-note">这张长图已经放进仓库，可直接作为对外展示入口。</p>
        <div class="evidence-actions">
          <a class="button primary" href="../../index.html#experience">回到吉比特经历</a>
          <a class="button secondary" href="../../index.html#evidence-jbt">看主站证据</a>
          <a class="button secondary" href="../../index.html">返回主站首页</a>
        </div>
      </article>
    </main>
  </body>
</html>
