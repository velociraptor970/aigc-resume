name: Generate lightweight video previews

on:
  push:
    paths:
      - "assets/local-docs/ps-ai-scene-demo.mp4"
      - "assets/local-docs/pa-ai-detail-demo.mp4"
      - ".github/workflows/generate-video-previews.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with LFS media
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Generate real posters and short previews
        run: |
          ffmpeg -y -ss 8 -i assets/local-docs/ps-ai-scene-demo.mp4 -frames:v 1 -vf "scale=960:-2" -q:v 3 assets/local-docs/ps-ai-scene-preview.jpg
          ffmpeg -y -ss 8 -i assets/local-docs/pa-ai-detail-demo.mp4 -frames:v 1 -vf "scale=960:-2" -q:v 3 assets/local-docs/pa-ai-detail-preview.jpg
          ffmpeg -y -ss 0 -i assets/local-docs/ps-ai-scene-demo.mp4 -t 12 -vf "scale=960:-2,fps=30" -an -c:v libx264 -preset veryfast -crf 28 -pix_fmt yuv420p -movflags +faststart assets/local-docs/ps-ai-scene-preview.mp4
          ffmpeg -y -ss 0 -i assets/local-docs/pa-ai-detail-demo.mp4 -t 12 -vf "scale=960:-2,fps=30" -an -c:v libx264 -preset veryfast -crf 28 -pix_fmt yuv420p -movflags +faststart assets/local-docs/pa-ai-detail-preview.mp4

      - name: Commit generated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/local-docs/ps-ai-scene-preview.jpg assets/local-docs/ps-ai-scene-preview.mp4 assets/local-docs/pa-ai-detail-preview.jpg assets/local-docs/pa-ai-detail-preview.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Generate lightweight video previews"
          git push
